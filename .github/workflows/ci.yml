# ============================================================
# Rook — CI/CD Pipeline
# Lint → Test → Build → Deploy
# ============================================================

name: Rook CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  NODE_VERSION: '20'

jobs:
  # === Lint & Build ===
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: cd ${{ matrix.project }} && npm ci

      - name: Type check (backend)
        if: matrix.project == 'backend'
        run: cd backend && npx tsc --noEmit

      - name: Build (frontend)
        if: matrix.project == 'frontend'
        run: cd frontend && npm run build

  # === Integration Tests ===
  test:
    name: Integration Test
    needs: lint-and-build
    runs-on: ubuntu-latest

    services:
      rook-db:
        image: node:20-alpine
        options: --name rook-db

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: cd backend && npm ci

      - name: Start server and run health check
        run: |
          cd backend
          npx tsx src/migrations/seed.ts &
          npx tsx src/index.ts &
          sleep 5
          curl -f http://localhost:4000/api/health || exit 1
          echo "Server health check passed!"

      - name: Test API endpoints
        run: |
          # Test login
          TOKEN=$(curl -s -X POST http://localhost:4000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo@acmecorp.com","password":"demo1234"}' | \
            node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).token))")
          
          # Test dashboard
          curl -f http://localhost:4000/api/dashboard \
            -H "Authorization: Bearer $TOKEN" || exit 1
          echo "Dashboard: OK"
          
          # Test providers
          curl -f http://localhost:4000/api/providers \
            -H "Authorization: Bearer $TOKEN" || exit 1
          echo "Providers: OK"
          
          echo "All API tests passed!"

  # === Docker Build ===
  docker:
    name: Docker Build
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: rook:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # === Deploy to Railway ===
  deploy:
    name: Deploy to Railway
    needs: [lint-and-build, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}