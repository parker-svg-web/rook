# ============================================================
# Rook — Render Blueprint (Infrastructure as Code)
# https://render.com/docs/blueprint-spec
# ============================================================

services:
  - type: web
    name: rook
    env: node
    region: oregon
    plan: starter
    buildCommand: cd backend && npm ci && npx tsc && cd ../frontend && npm ci && npm run build
    startCommand: node backend/dist/index.js
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER_MONTHLY
        sync: false
      - key: STRIPE_PRICE_STARTER_ANNUAL
        sync: false
      - key: STRIPE_PRICE_GROWTH_MONTHLY
        sync: false
      - key: STRIPE_PRICE_GROWTH_ANNUAL
        sync: false
      - key: STRIPE_OVERAGE_PRICE_ID
        sync: false
      - key: ROOK_TWILIO_API_KEY
        sync: false
      - key: ROOK_TWILIO_ACCOUNT_SID
        sync: false
      - key: ROOK_SENDGRID_API_KEY
        sync: false
      - key: ROOK_OPENAI_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
